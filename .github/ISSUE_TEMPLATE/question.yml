name: Usage question
description: Ask about installation, settings or using SuperX.
title: '[Question] '
body:
  - type: markdown
    attributes:
      value: 'Check the README and existing reports first. Do not share API Keys or private post content. Security vulnerabilities follow SECURITY.md.'
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where do you need help?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and installation source
      description: If relevant, include SuperX and browser versions and whether you installed from the Chrome Web Store, a GitHub Release or source.
